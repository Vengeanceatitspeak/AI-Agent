[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — Modular AI Assistant with MCP-based capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vengeance" }]

dependencies = [
    "mcp>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "aiosqlite>=0.20",
    "click>=8.1",
    "rich>=13.9",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "watchfiles>=0.24",
    "apscheduler>=3.10,<4.0",
    "python-dotenv>=1.0",
    "edge-tts>=7.2",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "pytz>=2024.1",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.55"]
llm-all = [
    "anthropic>=0.39",
    "google-genai>=1.0",
    "openai>=1.55",
]
memory = [
    "sqlite-vec>=0.1.9",
]
voice = [
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2",
    "openwakeword>=0.6.0",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
]
all = [
    "jarvis[llm-all,memory,voice,dev]",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "eval: Scenario evaluation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "jarvis.voice.*",
    "jarvis.api.*",
]
strict = false
disallow_untyped_defs = false
